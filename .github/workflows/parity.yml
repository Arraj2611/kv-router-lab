name: Engine parity

on:
  push:
  pull_request:

jobs:
  parity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.9"
      - name: Run JS engine
        run: node tools/parity_check.js
      - name: Compare against Python engine
        run: python tools/parity_check.py
